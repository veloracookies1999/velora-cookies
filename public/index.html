<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="VELORA Cookies - premium cookies experience">
  <title>VELORA Cookies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      let saved = "light";
      try { saved = localStorage.getItem("velora-theme") || "light"; } catch (_) {}
      const theme = saved === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      window.veloraSetTheme = (next) => {
        const value = next === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = value;
        document.documentElement.style.colorScheme = value;
        try { localStorage.setItem("velora-theme", value); } catch (_) {}
        document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
          const dark = value === "dark";
          button.setAttribute("aria-label", dark ? "Aktifkan light mode" : "Aktifkan dark mode");
          button.setAttribute("title", dark ? "Light mode" : "Dark mode");
          button.setAttribute("aria-pressed", String(dark));
          const label = button.querySelector("[data-theme-label]");
          if (label) label.textContent = dark ? "Light" : "Dark";
          const icon = button.querySelector("[data-theme-icon]");
          if (icon) icon.innerHTML = dark
            ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
            : '<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/>';
        });
      };
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-theme-toggle]");
        if (!button) return;
        event.preventDefault();
        window.veloraSetTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      });
    })();
  </script>

  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/mobile.css">
  <link rel="stylesheet" href="/assets/mobile-polish-final.css">
</head>
<body>
  <div class="grain"></div>

  <div id="veloraPageLoader" class="velora-page-loader is-active" aria-live="polite" aria-label="Memuat VELORA">
    <div class="velora-loader-orbit">
      <div class="velora-loader-cookie">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="velora-loader-copy">
      <strong>VELORA</strong>
      <span>Menyiapkan pengalamanmu...</span>
    </div>
    <div class="velora-loader-line"><i></i></div>
  </div>

  <div id="app"></div>
  <div id="toast"></div>

  <!-- Safety net runs independently of app.js and external mobile.js. -->
  <script>
    // Emergency watchdog: force-hide the overlay even if CSS class rules fail.
    window.setTimeout(() => {
      const loader = document.getElementById("veloraPageLoader");
      if (loader) {
        loader.style.setProperty("display", "none", "important");
        loader.classList.remove("is-active");
        loader.classList.add("is-hidden");
      }
      const app = document.getElementById("app");
      if (app && !app.children.length) {
        app.innerHTML = '<main style="min-height:70vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#30213d"><div style="max-width:360px"><h2>VELORA belum berhasil dimuat</h2><p style="color:#786b82;line-height:1.6">Aplikasi belum berhasil dimulai. Coba muat ulang. Jika tetap muncul, periksa deployment dan JavaScript aplikasi.</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:700">Muat ulang</button></div></main>';
      }
    }, 5000);
  </script>
  <script>
    window.setTimeout(() => {
      const loader = document.getElementById("veloraPageLoader");
      if (!loader || !loader.classList.contains("is-active")) return;

      loader.classList.remove("is-active");
      loader.classList.add("is-hidden");

      const app = document.getElementById("app");
      if (app && !app.children.length) {
        app.innerHTML = `
          <main style="min-height:70vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#30213d">
            <div style="max-width:360px">
              <div style="font-size:34px;margin-bottom:12px">VELORA</div>
              <h2 style="margin:0 0 10px">Halaman belum selesai dimuat</h2>
              <p style="color:#786b82;line-height:1.6">Koneksi server, konfigurasi, atau database sedang bermasalah. Muat ulang halaman atau coba beberapa saat lagi.</p>
              <button onclick="location.reload()" style="border:0;border-radius:12px;background:#7040c7;color:white;padding:12px 20px;font-weight:700;cursor:pointer">Muat ulang</button>
            </div>
          </main>`;
      }
    }, 12000);
  </script>

  <script type="module" src="/assets/app.js"></script>
  <script defer src="/assets/mobile.js"></script>
</body>
</html>
